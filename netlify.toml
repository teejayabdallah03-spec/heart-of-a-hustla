[build]
  command = "node build.js"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/payment-status"
  status = 200

[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

[[redirects]]
  from = "/api/checkout-session"
  to = "/.netlify/functions/checkout-session"
  status = 200
